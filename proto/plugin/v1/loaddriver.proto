// LoadDriver plugins generate load against the target (DESIGN.md §5.1).
// loaddriver-kapture composes a CaptureLoadTest and watches its rollups.
// Swap boundary: trial.
syntax = "proto3";

package parallax.plugin.v1;

option go_package = "github.com/aburan28/parallax/proto/plugin/v1;pluginv1";

service LoadDriver {
  rpc Plan(PlanRequest) returns (PlanResponse);
  rpc Start(StartRequest) returns (StartResponse);
  // Watch streams progress + abort-policy state until the run terminates.
  rpc Watch(WatchRequest) returns (stream WatchEvent);
  rpc Stop(StopRequest) returns (StopResponse);
}

message PlanRequest {
  bytes workload_json = 1;
}

message PlanResponse {
  bool ok = 1;
  string detail = 2;
  int64 total_shards = 3;
}

message StartRequest {
  bytes workload_json = 1;
  string trial_id = 2;
}

message StartResponse {
  // Opaque handle for Watch/Stop (e.g. the CaptureLoadTest namespace/name).
  string run_ref = 1;
  string detail = 2;
}

message WatchRequest {
  string run_ref = 1;
}

message WatchEvent {
  string phase = 1;
  int64 sent_requests = 2;
  int64 failed_requests = 3;
  double achieved_rps = 4;
  bool aborted = 5;
  string abort_reason = 6;
}

message StopRequest {
  string run_ref = 1;
}

// RunReport mirrors kapture's TrafficReplay run-report fields (DESIGN.md App. A.2),
// aggregated across shards.
message RunReport {
  int64 total_requests = 1;
  int64 sent_requests = 2;
  int64 failed_requests = 3;
  int64 filtered_requests = 4;
  int64 duration_ms = 5;
  double achieved_rps = 6;
  double mean_latency_ms = 7;
  double p50_latency_ms = 8;
  double p95_latency_ms = 9;
  double p99_latency_ms = 10;
}

message StopResponse {
  bool ok = 1;
  RunReport report = 2;
}
