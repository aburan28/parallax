# Example Dataset registration: a captured-traffic corpus.
#
# `source.kind` discriminates where a corpus comes from — kapture-capture is one
# kind among object-storage, git and generator, not the only shape a dataset can
# take (docs/GENERALIZATION.md G2). See docs/DESIGN.md §10.
apiVersion: parallax.dev/v1alpha1
kind: Dataset
metadata:
  name: prod-edge-2026-07-14
  namespace: bench
spec:
  source:
    kind: kapture-capture
    ref: { name: checkout-capture }
    config:
      namespace: edge
  storageRef: { name: bench-dataset-store }
  preshard: { shards: 8 }   # produced by `parallax datasets preshard` (kapture-preshard)
