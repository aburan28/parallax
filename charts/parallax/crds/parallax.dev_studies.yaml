---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: studies.parallax.dev
spec:
  group: parallax.dev
  names:
    kind: Study
    listKind: StudyList
    plural: studies
    shortNames:
    - study
    singular: study
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.trialsCompleted
      name: Trials
      type: string
    - jsonPath: .status.runID
      name: Run
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Study is the Schema for the studies API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StudySpec is the declarative experiment (DESIGN.md §8).
            properties:
              baseline:
                description: Baseline is the reference configuration every candidate
                  is compared against.
                properties:
                  name:
                    type: string
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              budgets:
                properties:
                  maxClusterTime:
                    type: string
                  maxTrials:
                    format: int32
                    type: integer
                  maxWallClock:
                    type: string
                type: object
              environment:
                properties:
                  clusterRef:
                    description: ClusterRef selects a benchmark cluster kubeconfig
                      secret; omit = operator's cluster.
                    properties:
                      secretName:
                        minLength: 1
                        type: string
                    required:
                    - secretName
                    type: object
                type: object
              guardrails:
                items:
                  description: Guardrail is a hard constraint; a breach disqualifies
                    a config (DESIGN.md §8).
                  properties:
                    max:
                      description: |-
                        Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                        avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                      pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                      type: string
                    maxRelativeToBaseline:
                      description: |-
                        Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                        avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                      pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                      type: string
                    min:
                      description: |-
                        Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                        avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                      pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                      type: string
                    provider:
                      description: Inline provider query form (guardrail without a
                        named SLI).
                      type: string
                    query:
                      type: string
                    sli:
                      type: string
                  type: object
                type: array
              objectives:
                properties:
                  primary:
                    properties:
                      direction:
                        enum:
                        - minimize
                        - maximize
                        type: string
                      minPracticalEffect:
                        description: |-
                          Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                          avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                        pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                        type: string
                      sli:
                        minLength: 1
                        type: string
                    required:
                    - direction
                    - sli
                    type: object
                  secondary:
                    items:
                      properties:
                        direction:
                          enum:
                          - minimize
                          - maximize
                          type: string
                        minPracticalEffect:
                          description: |-
                            Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                            avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                          pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                          type: string
                        sli:
                          minLength: 1
                          type: string
                      required:
                      - direction
                      - sli
                      type: object
                    type: array
                required:
                - primary
                type: object
              promotion:
                properties:
                  approval:
                    enum:
                    - manual
                    - auto
                    type: string
                  output:
                    type: string
                  require:
                    items:
                      type: string
                    type: array
                type: object
              schedule:
                description: |-
                  Schedule, when set, re-runs the study on a cron cadence appending to the same
                  DB lineage (DESIGN.md §16). Format: standard cron.
                type: string
              selection:
                properties:
                  method:
                    enum:
                    - pareto-weighted
                    - lexicographic
                    type: string
                  topK:
                    default: 3
                    format: int32
                    type: integer
                type: object
              slis:
                items:
                  description: SLISpec declares one service-level indicator and the
                    provider that evaluates it.
                  properties:
                    class:
                      description: 'Trust class: fidelity | client | server | derived
                        (§11).'
                      type: string
                    expr:
                      type: string
                    name:
                      minLength: 1
                      type: string
                    provider:
                      minLength: 1
                      type: string
                    query:
                      type: string
                  required:
                  - name
                  - provider
                  type: object
                minItems: 1
                type: array
              space:
                description: Space is the search space (dimensions, constraints, strategy).
                properties:
                  constraints:
                    description: CEL expressions pruning invalid combinations before
                      trials are spent (§8).
                    items:
                      type: string
                    type: array
                  dimensions:
                    items:
                      description: |-
                        Dimension is one axis of the search space. Exactly one of Int/Float/Categorical
                        must be set. Names are target-plugin dimension paths (e.g. agent.batchSize).
                      properties:
                        categorical:
                          properties:
                            values:
                              items:
                                type: string
                              minItems: 1
                              type: array
                          required:
                          - values
                          type: object
                        float:
                          description: FloatRange bounds are decimal strings (see
                            DecimalString) to avoid CRD floats.
                          properties:
                            log:
                              type: boolean
                            max:
                              description: |-
                                Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                                avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                              pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                              type: string
                            min:
                              description: |-
                                Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                                avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                              pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                              type: string
                          required:
                          - max
                          - min
                          type: object
                        int:
                          properties:
                            log:
                              type: boolean
                            max:
                              format: int64
                              type: integer
                            min:
                              format: int64
                              type: integer
                          required:
                          - max
                          - min
                          type: object
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                  strategy:
                    description: |-
                      PluginRef names a Plugin CR and carries a config block validated by that
                      plugin's Describe() JSON Schema (DESIGN.md §5.3).
                    properties:
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      plugin:
                        minLength: 1
                        type: string
                    required:
                    - plugin
                    type: object
                required:
                - dimensions
                - strategy
                type: object
              target:
                description: Target names a Ready Plugin of kind target and its config.
                properties:
                  config:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  plugin:
                    minLength: 1
                    type: string
                required:
                - plugin
                type: object
              validation:
                properties:
                  alpha:
                    description: |-
                      Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                      avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                    pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                    type: string
                  correction:
                    enum:
                    - holm
                    - bonferroni
                    - none
                    type: string
                  reps:
                    default: 5
                    format: int32
                    type: integer
                  scenarios:
                    items:
                      type: string
                    type: array
                type: object
              workloads:
                items:
                  properties:
                    cooldown:
                      type: string
                    datasetRef:
                      description: LocalRef references an object by name in the same
                        namespace.
                      properties:
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    measure:
                      type: string
                    name:
                      minLength: 1
                      type: string
                    replay:
                      description: ReplaySpec mirrors CaptureLoadTest.spec field names
                        (DESIGN.md §8, App. A.1).
                      properties:
                        abort:
                          properties:
                            errorPercent:
                              format: int32
                              type: integer
                            maxDuration:
                              type: string
                          type: object
                        distribution:
                          properties:
                            cells:
                              items:
                                type: string
                              type: array
                            concurrencyPerWorker:
                              format: int32
                              type: integer
                            workersPerSpoke:
                              format: int32
                              type: integer
                          type: object
                        engine:
                          type: string
                        rate:
                          properties:
                            mode:
                              enum:
                              - Constant
                              - OriginalTiming
                              - Unlimited
                              type: string
                            requestsPerSecond:
                              format: int64
                              type: integer
                            timeScale:
                              description: |-
                                Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                                avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                              pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                              type: string
                          required:
                          - mode
                          type: object
                      required:
                      - rate
                      type: object
                    warmup:
                      type: string
                  required:
                  - datasetRef
                  - name
                  - replay
                  type: object
                minItems: 1
                type: array
            required:
            - objectives
            - slis
            - space
            - target
            - workloads
            type: object
          status:
            description: StudyStatus is the observed funnel state (DESIGN.md §6).
            properties:
              candidates:
                description: Candidate config hashes advanced to validation.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              decisionRef:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: StudyPhase is the funnel phase of a Study (DESIGN.md
                  §4.1, §7).
                type: string
              promotionRef:
                type: string
              runID:
                description: RunID is the results-DB run this study is writing to.
                type: string
              trialsCompleted:
                format: int32
                type: integer
              trialsTotal:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
