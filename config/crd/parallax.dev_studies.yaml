---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: studies.parallax.dev
spec:
  group: parallax.dev
  names:
    kind: Study
    listKind: StudyList
    plural: studies
    shortNames:
    - study
    singular: study
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.trialsCompleted
      name: Trials
      type: string
    - jsonPath: .status.runID
      name: Run
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Study is the Schema for the studies API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StudySpec is the declarative experiment (DESIGN.md §8).
            properties:
              baseline:
                description: Baseline is the reference configuration every candidate
                  is compared against.
                properties:
                  name:
                    type: string
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              budgets:
                properties:
                  maxClusterTime:
                    type: string
                  maxTrials:
                    format: int32
                    type: integer
                  maxWallClock:
                    type: string
                type: object
              environment:
                properties:
                  clusterRef:
                    description: ClusterRef selects a benchmark cluster kubeconfig
                      secret; omit = operator's cluster.
                    properties:
                      secretName:
                        minLength: 1
                        type: string
                    required:
                    - secretName
                    type: object
                type: object
              guardrails:
                items:
                  description: Guardrail is a hard constraint; a breach disqualifies
                    a config (DESIGN.md §8).
                  properties:
                    from:
                      description: |-
                        From is the inline provider form: a guardrail evaluated directly, without a
                        named SLI. Same shape as SLISpec.From.
                      properties:
                        config:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        plugin:
                          minLength: 1
                          type: string
                      required:
                      - plugin
                      type: object
                    max:
                      description: |-
                        Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                        avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                      pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                      type: string
                    maxRelativeToBaseline:
                      description: |-
                        Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                        avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                      pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                      type: string
                    min:
                      description: |-
                        Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                        avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                      pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                      type: string
                    sli:
                      type: string
                  type: object
                type: array
              objectives:
                properties:
                  primary:
                    properties:
                      direction:
                        enum:
                        - minimize
                        - maximize
                        type: string
                      minPracticalEffect:
                        description: |-
                          Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                          avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                        pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                        type: string
                      sli:
                        minLength: 1
                        type: string
                    required:
                    - direction
                    - sli
                    type: object
                  secondary:
                    items:
                      properties:
                        direction:
                          enum:
                          - minimize
                          - maximize
                          type: string
                        minPracticalEffect:
                          description: |-
                            Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                            avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                          pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                          type: string
                        sli:
                          minLength: 1
                          type: string
                      required:
                      - direction
                      - sli
                      type: object
                    type: array
                required:
                - primary
                type: object
              promotion:
                properties:
                  approval:
                    enum:
                    - manual
                    - auto
                    type: string
                  output:
                    type: string
                  require:
                    items:
                      type: string
                    type: array
                type: object
              schedule:
                description: |-
                  Schedule, when set, re-runs the study on a cron cadence appending to the same
                  DB lineage (DESIGN.md §16). Format: standard cron.
                type: string
              selection:
                properties:
                  method:
                    enum:
                    - pareto-weighted
                    - lexicographic
                    type: string
                  topK:
                    default: 3
                    format: int32
                    type: integer
                type: object
              slis:
                items:
                  description: |-
                    SLISpec declares one service-level indicator and where its value comes from.
                    Exactly one of From/Driver/Derived must be set.
                  properties:
                    class:
                      description: 'Trust class: fidelity | client | server | derived
                        (§11).'
                      type: string
                    derived:
                      description: |-
                        Derived computes the SLI in-core from other SLIs of the same trial; no plugin
                        is involved.
                      properties:
                        expr:
                          minLength: 1
                          type: string
                      required:
                      - expr
                      type: object
                    driver:
                      description: |-
                        Driver reads a metric the workload's load driver reported when the run ended.
                        The core already holds these (StopResponse.metrics), so no plugin round-trip is
                        involved — and any driver's metric names work, not just an HTTP replay's.
                      properties:
                        metric:
                          minLength: 1
                          type: string
                      required:
                      - metric
                      type: object
                    from:
                      description: |-
                        From evaluates the SLI through a provider plugin. Config is the provider's own
                        query dialect — `{query: <PromQL>}` for prometheus, whatever a third-party
                        provider declares. The core treats it as opaque (docs/GENERALIZATION.md G6).
                      properties:
                        config:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        plugin:
                          minLength: 1
                          type: string
                      required:
                      - plugin
                      type: object
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              space:
                description: Space is the search space (dimensions, constraints, strategy).
                properties:
                  constraints:
                    description: CEL expressions pruning invalid combinations before
                      trials are spent (§8).
                    items:
                      type: string
                    type: array
                  dimensions:
                    items:
                      description: |-
                        Dimension is one axis of the search space. Exactly one of Int/Float/Categorical
                        must be set.
                      properties:
                        categorical:
                          properties:
                            values:
                              items:
                                type: string
                              minItems: 1
                              type: array
                          required:
                          - values
                          type: object
                        float:
                          description: FloatRange bounds are decimal strings (see
                            DecimalString) to avoid CRD floats.
                          properties:
                            log:
                              type: boolean
                            max:
                              description: |-
                                Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                                avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                              pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                              type: string
                            min:
                              description: |-
                                Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                                avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                              pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                              type: string
                          required:
                          - max
                          - min
                          type: object
                        int:
                          properties:
                            log:
                              type: boolean
                            max:
                              format: int64
                              type: integer
                            min:
                              format: int64
                              type: integer
                          required:
                          - max
                          - min
                          type: object
                        mapping:
                          description: |-
                            Mapping carries a richer target-defined mapping for dimensions a single Path
                            cannot express (e.g. one axis fanning out to several fields). Opaque to the
                            core; validated by the target plugin.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        name:
                          minLength: 1
                          type: string
                        path:
                          description: |-
                            Path is the target-plugin config location this dimension writes: a Helm value
                            path (`.env.GOGC`), a JSON pointer, a flag name — whatever the target's
                            Contract() accepts. Defaults to Name, preserving the "dimension names are
                            target paths" convention target-kapture relies on (DESIGN.md §8).
                          type: string
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                  strategy:
                    description: |-
                      PluginRef names a Plugin CR and carries a config block validated by that
                      plugin's Describe() JSON Schema (DESIGN.md §5.3).
                    properties:
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      plugin:
                        minLength: 1
                        type: string
                    required:
                    - plugin
                    type: object
                required:
                - dimensions
                - strategy
                type: object
              target:
                description: Target names a Ready Plugin of kind target and its config.
                properties:
                  config:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  plugin:
                    minLength: 1
                    type: string
                required:
                - plugin
                type: object
              validation:
                properties:
                  alpha:
                    description: |-
                      Numeric thresholds and bounds are carried as decimal strings in the CRD API to
                      avoid Kubernetes' discouraged float fields; they are parsed by internal/analysis.
                    pattern: ^-?[0-9]+(\.[0-9]+)?%?$
                    type: string
                  correction:
                    enum:
                    - holm
                    - bonferroni
                    - none
                    type: string
                  reps:
                    default: 5
                    format: int32
                    type: integer
                  scenarios:
                    items:
                      type: string
                    type: array
                type: object
              workloads:
                items:
                  description: |-
                    Workload is one load definition: a driver plugin, its driver-defined config, and
                    the measurement window around it. The core knows nothing about what the driver
                    does — replay, synthetic request generation, a batch submission, a query harness
                    (DESIGN.md §8; docs/GENERALIZATION.md G1).
                  properties:
                    completion:
                      default: duration
                      description: Completion selects what ends the measurement window
                        (see CompletionMode).
                      enum:
                      - duration
                      - driver
                      type: string
                    cooldown:
                      description: Cooldown quiesces the system after the window closes,
                        before collection.
                      type: string
                    datasetRef:
                      description: |-
                        DatasetRef names the corpus this workload replays or reads. Optional: drivers
                        that generate load synthetically have no dataset.
                      properties:
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    driver:
                      description: |-
                        Driver names a Ready Plugin of kind loaddriver plus its config. The config is
                        opaque to parallax and validated by the plugin's Describe() JSON Schema — a
                        replay driver takes rate/distribution/abort here, a batch driver takes a job
                        template, a query driver takes a scale factor.
                      properties:
                        config:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        plugin:
                          minLength: 1
                          type: string
                      required:
                      - plugin
                      type: object
                    maxDuration:
                      description: |-
                        MaxDuration caps the measurement window regardless of mode: a driver that
                        never reports done, or a run that overshoots, aborts the trial rather than
                        burning the study's wall-clock budget.
                      type: string
                    measure:
                      default: 5m
                      description: |-
                        Measure is the measurement window for completion=duration. Ignored when
                        completion=driver, where the driver decides and MaxDuration bounds it.
                        Defaulted so an omitted window can never silently mean "measure nothing".
                      type: string
                    name:
                      minLength: 1
                      type: string
                    warmup:
                      description: Warmup runs the load unmeasured before t1 is stamped.
                      type: string
                  required:
                  - driver
                  - name
                  type: object
                minItems: 1
                type: array
            required:
            - objectives
            - slis
            - space
            - target
            - workloads
            type: object
          status:
            description: StudyStatus is the observed funnel state (DESIGN.md §6).
            properties:
              candidates:
                description: Candidate config hashes advanced to validation.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              decisionRef:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: StudyPhase is the funnel phase of a Study (DESIGN.md
                  §4.1, §7).
                type: string
              promotionRef:
                type: string
              runID:
                description: RunID is the results-DB run this study is writing to.
                type: string
              trialsCompleted:
                format: int32
                type: integer
              trialsTotal:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
