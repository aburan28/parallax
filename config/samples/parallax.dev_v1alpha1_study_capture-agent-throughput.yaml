# Flagship dogfood study: tune kapture's own capture-agent data plane.
# Screens the flag-level knobs in `direct` mode on kind, validates the
# CR-expressible survivors in `integrated` mode. See docs/DESIGN.md §8.
apiVersion: parallax.dev/v1alpha1
kind: Study
metadata:
  name: capture-agent-throughput
  namespace: bench
spec:
  target:
    plugin: target-kapture
    config:
      chartRef: { repo: ../kapture/charts/kapture, version: ">=0.1" }
      namespace: capture-system
      mode: direct

  baseline:
    name: shipped-defaults
    values: {}   # batchSize=100, flushInterval=5s, writeQueueSize=4096, maxBodyBytes=1MiB

  space:
    dimensions:
      - name: agent.batchSize            # capture-agent --batch-size
        int: { min: 50, max: 2000, log: true }
      - name: agent.flushInterval        # --flush-interval
        categorical: { values: [1s, 5s, 15s] }
      - name: agent.writeQueueSize       # --write-queue-size
        int: { min: 1024, max: 65536, log: true }
      - name: agent.maxBodyBytes         # --max-body-bytes
        categorical: { values: [262144, 1048576, 4194304] }
      - name: agent.resources.cpuLimit
        categorical: { values: [500m, 1000m, 2000m] }
      - name: agent.replicas
        int: { min: 1, max: 6 }
    constraints:
      - "agent.batchSize * int(agent.maxBodyBytes) <= 2147483648"
    strategy:
      # builtin: runs compiled into the operator, so --local needs no plugin install.
      # An unprefixed name is a Plugin CR that must be Ready; there is no fallback
      # between the two (docs/GENERALIZATION.md G3).
      plugin: builtin:random
      config: { points: 40, seed: 17 }

  workloads:
    - name: steady-2k
      datasetRef: { name: prod-edge-2026-07-14 }
      # The driver plugin owns the replay vocabulary; parallax passes this block
      # through untouched (docs/GENERALIZATION.md G1).
      driver:
        plugin: loaddriver-kapture
        config:
          engine: builtin
          rate: { mode: Constant, requestsPerSecond: 2000 }
          distribution: { cells: [bench-a], workersPerSpoke: 2, concurrencyPerWorker: 25 }
          abort: { maxDuration: 10m, errorPercent: 10 }
      completion: duration          # continuous replay; the study closes the window
      warmup: 2m
      measure: 5m
      maxDuration: 10m
      cooldown: 30s

  slis:
    - name: capture_loss_ratio
      class: fidelity
      from: { plugin: readback }
    - name: capture_drop_ratio
      class: server
      from:
        plugin: prometheus
        config:
          query: |
            sum(rate(capture_agent_requests_dropped_total[{{.Window}}]))
              / sum(rate(capture_agent_requests_total[{{.Window}}]))
    - name: queue_saturation_peak
      class: server
      from:
        plugin: prometheus
        config:
          query: |
            max_over_time((capture_agent_write_queue_depth
              / capture_agent_write_queue_capacity)[{{.Window}}:15s])
    # Client-side truth comes straight from the load driver's reported metrics —
    # no provider plugin in the path (docs/GENERALIZATION.md G5).
    - name: replay_failed_requests
      class: client
      driver: { metric: failed_requests }
    - name: replay_sent_requests
      class: client
      driver: { metric: sent_requests }
    - name: client_p99_ms
      class: client
      driver: { metric: p99_latency_ms }
    - name: replay_error_ratio
      class: derived
      derived: { expr: replay_failed_requests / replay_sent_requests }
    - name: agent_cpu_cores
      class: server
      from:
        plugin: prometheus
        config:
          query: |
            sum(rate(container_cpu_usage_seconds_total{pod=~"capture-agent-.*"}[{{.Window}}]))
    - name: capture_throughput_rps
      class: server
      from:
        plugin: prometheus
        config:
          query: |
            sum(rate(capture_agent_requests_total[{{.Window}}]))
    - name: cpu_seconds_per_1k_captured
      class: derived
      derived: { expr: agent_cpu_cores * 1000 / capture_throughput_rps }

  guardrails:
    - { sli: capture_loss_ratio, max: 0.0 }
    - { sli: capture_drop_ratio, max: 0.0 }
    - { sli: replay_error_ratio, max: 0.001 }
    - { sli: client_p99_ms, maxRelativeToBaseline: 1.05 }
    - from:
        plugin: prometheus
        config: { query: 'sum(increase(capture_agent_storage_write_errors_total[{{.Window}}]))' }
      max: 0
    - from:
        plugin: prometheus
        config: { query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="capture-system"}[{{.Window}}]))' }
      max: 0

  objectives:
    primary:   { sli: cpu_seconds_per_1k_captured, direction: minimize, minPracticalEffect: "5%" }
    secondary:
      - { sli: queue_saturation_peak, direction: minimize }

  selection: { topK: 3, method: pareto-weighted }

  validation:
    reps: 5
    alpha: 0.05
    correction: holm
    scenarios: [soak-30m, burst-3x, agent-kill, storage-outage-60s]

  budgets: { maxTrials: 80, maxClusterTime: 12h, maxWallClock: 24h }

  promotion:
    approval: manual
    output: golden/capture-agent-values.yaml
    require: [validation.pass, scenarios.pass]
