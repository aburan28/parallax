# Sample Plugin CR (cluster-scoped). The plugin controller verifies the image
# signature, resolves the digest, and the host installs + hot-reloads the binary.
apiVersion: parallax.dev/v1alpha1
kind: Plugin
metadata:
  name: provider-prometheus
spec:
  kind: provider
  image: ghcr.io/aburan28/parallax-provider-prometheus:0.1.0
  verify:
    cosign:
      keylessIdentity: "https://github.com/aburan28/parallax/.github/workflows/release.yaml@refs/tags/*"
      rekor: true
  config:
    endpoint: http://prometheus.monitoring:9090
    scrapeIntervalHint: 5s
